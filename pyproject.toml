[project]
name = "margin"
version = "0.1.0"
description = "Offline study assistant: exam-weighted notes, diagrams and practice questions from your own books and past papers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Kunsh" }]
keywords = ["study", "offline", "rag", "llm", "exam", "notes", "flashcards", "llama.cpp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "fastembed>=0.8",
  "fsrs>=6",
  "genanki>=0.13",
  "httpx>=0.27",
  "markdown-it-py>=3",
  "onnxruntime>=1.20",
  "pillow>=10",
  "platformdirs>=4",
  "psutil>=5.9",
  "pydantic>=2.7",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "rapidocr>=3",
  "rich>=13",
  "sympy>=1.13",
  "textual>=1",
  "tokenizers>=0.15",
]

[project.urls]
Homepage = "https://github.com/Kunsh162007/margin"
Issues = "https://github.com/Kunsh162007/margin/issues"

[project.scripts]
margin = "margin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]
evals = ["pillow>=10", "rapidocr>=3", "onnxruntime>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
